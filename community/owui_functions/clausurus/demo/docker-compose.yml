# Clausurus demo: Open WebUI (v0.11.3, the version this platform runs) with Clausurus
# installed and its keys copied from .env into the function's settings.
#
#   cp .env.example .env    # fill in APERTUS_API_KEY and at least one provider key
#   docker compose up
#   open http://localhost:3000  (log in as admin@example.com / clausurus-demo-only)
#
# Local demo only; not connected to the Public AI production deployment.

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    ports:
      - "3000:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      ENABLE_OLLAMA_API: "false"
    volumes:
      - openwebui-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 60

  installer:
    image: python:3.12-slim
    depends_on:
      openwebui:
        condition: service_healthy
    env_file: .env
    environment:
      WEBUI_BASE_URL: http://openwebui:8080
      PUBLIC_URL: http://localhost:3000
      CLAUSURUS_PATH: /clausurus/clausurus.py
    volumes:
      - ../clausurus.py:/clausurus/clausurus.py:ro
      - ./install_function.py:/install_function.py:ro
    command: sh -c "pip install --quiet httpx && python /install_function.py"
    restart: "no"

volumes:
  openwebui-data:
